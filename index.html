    <main>
      <header>
        <div class="logo">
          <img src="laundro.png" alt="Laundro Logo" />
          <h2>LAUNDRO</h2>
        </div>
        <p>
          A comprehensive report on the development and evaluation of Laundro.
        </p>
      </header>
      <div class="description">
        <h2>Home</h2>
        <p>
          This report documents the individual contributions of each person in
          the development of the Laundro system.
        </p>
      </div>
      <section class="card">
        <h2>Group Profiles</h2>
        <p>Flip to reveal details.</p>
        <div class="profiles">
          <div class="profile card hover flip-card">
            <input
              type="checkbox"
              id="profile-1-flip"
              class="profile-flip-toggle"
            />
            <label for="profile-1-flip" class="profile-flip-inner">
              <span class="profile-flip-face profile-flip-front">
                <img
                  src="members/profile_1.jpg"
                  alt="Vincent Roland C. Atole"
                />
                <h3>Vincent Roland C. Atole</h3>
                <p class="role">Leader</p>
              </span>
              <span class="profile-flip-face profile-flip-back">
                <h3>Vincent Roland C. Atole</h3>
                <p class="role">Leader</p>
                <p class="role-description">
                  Directed the overall development of the "Laundro" prototype to
                  maintain consistency across the app. Specifically: Initial
                  layout design and development of the web report; standardized
                  UI components in Figma; polished the app's colors, typography,
                  and animations.
                </p>
              </span>
            </label>
          </div>
          <div class="profile card hover flip-card">
            <input
              type="checkbox"
              id="profile-2-flip"
              class="profile-flip-toggle"
            />
            <label for="profile-2-flip" class="profile-flip-inner">
              <span class="profile-flip-face profile-flip-front">
                <img src="members/profile_2.jpg" alt="Kaicer R. Adayo" />
                <h3>Kaicer R. Adayo</h3>
                <p class="role">UI/UX Designer</p>
              </span>
              <span class="profile-flip-face profile-flip-back">
                <h3>Kaicer R. Adayo</h3>
                <p class="role">UI/UX Designer</p>
                <p class="role-description">
                  Enhanced the LAUNDRO Prototype's overall user experience and
                  performance by designing key interfaces (including profile,
                  start-up, and preferences screens), adding interactive
                  animations to the home page, and optimizing visual assets to
                  reduce lag.
                </p>
              </span>
            </label>
          </div>
          <div class="profile card hover flip-card">
            <input
              type="checkbox"
              id="profile-3-flip"
              class="profile-flip-toggle"
            />
            <label for="profile-3-flip" class="profile-flip-inner">
              <span class="profile-flip-face profile-flip-front">
                <img src="members/profile_3.jpg" alt="Brian Jose D. Lim" />
                <h3>Brian Jose D. Lim</h3>
                <p class="role">Interaction Designer</p>
              </span>
              <span class="profile-flip-face profile-flip-back">
                <h3>Brian Jose D. Lim</h3>
                <p class="role">Interaction Designer</p>
                <p class="role-description">
                  Improved the prototype's overall user experience by optimizing
                  animations and page transitions, fixing menu glitches, and
                  refining visual feedback elements like modal timing and fade
                  effects for smoother, more seamless interactions.
                </p>
              </span>
            </label>
          </div>
          <div class="profile card hover flip-card">
            <input
              type="checkbox"
              id="profile-4-flip"
              class="profile-flip-toggle"
            />
            <label for="profile-4-flip" class="profile-flip-inner">
              <span class="profile-flip-face profile-flip-front">
                <img
                  src="members/profile_4.jpg"
                  alt="Ashley Nicole T. Mañago"
                />
                <h3>Ashley Nicole T. Mañago</h3>
                <p class="role">Assistant Leader</p>
              </span>
              <span class="profile-flip-face profile-flip-back">
                <h3>Ashley Nicole T. Mañago</h3>
                <p class="role">Assistant Leader</p>
                <p class="role-description">
                  Assisted the group leader in managing system development lifecycles and task allocations. Contributed to frontend implementation, ensuring clean layouts, responsive interface behaviors, and standardizing application views.
                </p>
              </span>
            </label>
          </div>
          <div class="profile card hover flip-card">
            <input
              type="checkbox"
              id="profile-5-flip"
              class="profile-flip-toggle"
            />
            <label for="profile-5-flip" class="profile-flip-inner">
              <span class="profile-flip-face profile-flip-front">
                <img src="members/profile_5.jpg" alt="Lysalyn P. Pacao" />
                <h3>Lysalyn P. Pacao</h3>
                <p class="role">Interface Designer</p>
              </span>
              <span class="profile-flip-face profile-flip-back">
                <h3>Lysalyn P. Pacao</h3>
                <p class="role">Interface Designer</p>
                <p class="role-description">
                  Enhanced Laundro's usability and mobile accessibility by
                  designing communication portals, implementing interactive
                  features like slide-up modals and date pickers, and
                  standardizing the overall layout and navigation for
                  consistency.
                </p>
              </span>
            </label>
          </div>
        </div>
      </section>
